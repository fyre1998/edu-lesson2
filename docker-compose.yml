services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://workbench:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/workbench
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8192}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-openai/gpt-4o-mini-transcribe}
      CLASSROOM_CODE: ${CLASSROOM_CODE:-BIO-302}
      CLASSROOM_TEACHER_PASSWORD: ${CLASSROOM_TEACHER_PASSWORD:-}
      DATA_DIR: /app/data
    volumes:
      - uploads:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workbench
      POSTGRES_DB: workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workbench -d workbench']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  postgres:
  uploads:
  caddy_data:
  caddy_config:
