name: edu-lesson2

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://workbench:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/workbench
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8192}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_PROVIDER_SORT: ${AI_PROVIDER_SORT:-}
      AI_FAILOVER_ENABLED: ${AI_FAILOVER_ENABLED:-false}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-qwen3.8-flash}
      AI_FIRST_CONTENT_SECONDS: ${AI_FIRST_CONTENT_SECONDS:-10}
      AI_CHAT_ATTEMPT_SECONDS: ${AI_CHAT_ATTEMPT_SECONDS:-25}
      AI_TASK_ATTEMPT_SECONDS: ${AI_TASK_ATTEMPT_SECONDS:-40}
      AI_TOTAL_SECONDS: ${AI_TOTAL_SECONDS:-85}
      AI_FAILOVER_COOLDOWN_SECONDS: ${AI_FAILOVER_COOLDOWN_SECONDS:-60}
      AI_FAILOVER_HOLD_UNTIL: ${AI_FAILOVER_HOLD_UNTIL:-}
      STT_FAILOVER_ENABLED: ${STT_FAILOVER_ENABLED:-false}
      STT_FALLBACK_MODEL: ${STT_FALLBACK_MODEL:-qwen/qwen3-asr-0.6b}
      STT_FALLBACK_BASE_URL: ${STT_FALLBACK_BASE_URL:-https://openrouter.ai/api/v1}
      STT_FALLBACK_API_KEY: ${STT_FALLBACK_API_KEY:-}
      STT_PRIMARY_SECONDS: ${STT_PRIMARY_SECONDS:-10}
      STT_BACKUP_SECONDS: ${STT_BACKUP_SECONDS:-30}
      STT_TOTAL_SECONDS: ${STT_TOTAL_SECONDS:-65}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_MODEL: ${STT_MODEL:-qwen/qwen3-asr-0.6b}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_REGION: ${DASHSCOPE_REGION:-cn-beijing}
      DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID:-}
      CLASSROOM_CODE: ${CLASSROOM_CODE:-BIO-LESSON2}
      CLASSROOM_TEACHER_PASSWORD: ${CLASSROOM_TEACHER_PASSWORD:-}
      DATA_DIR: /app/data
      APP_INSTANCE_ID: lesson2-production
    volumes:
      - uploads:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workbench
      POSTGRES_DB: workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workbench -d workbench']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  postgres:
  uploads:
